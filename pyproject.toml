[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "asset-classifier"
version = "2.0.0"
description = "Asset register classification tool — matches assets against standardised classification systems using hybrid TF-IDF, Jaccard, and optional semantic embedding scoring."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["asset management", "classification", "EAM", "MDM", "UNICLASS", "infrastructure"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business",
]
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=2.2.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
asset-classifier = "main:main"

[project.urls]
Repository = "https://github.com/Emmanuel-Haikalis/EAM_MDM"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["src/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
